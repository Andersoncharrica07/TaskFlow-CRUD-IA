<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gestor de Tareas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="app.js" defer></script>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <h1><i class="fa-solid fa-list-check"></i> TaskFlow</h1>
            <p>Organiza tu día a día con facilidad</p>
        </header>

        <form id="task-form" class="task-form">
            <div class="input-group">
                <input type="text" id="task-input" placeholder="¿Qué tarea tienes pendiente hoy?" required autocomplete="off">
            </div>
            
            <div class="form-actions">
                <select id="task-priority" class="priority-select">
                    <option value="baja">Prioridad Baja</option>
                    <option value="media" selected>Prioridad Media</option>
                    <option value="alta">Prioridad Alta</option>
                </select>
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-plus"></i> Agregar
                </button>
            </div>
        </form>

        <main class="tasks-section">
            <div class="section-header">
                <h2>Mis Tareas</h2>
                <span id="task-counter" class="task-counter">0 pendientes</span>
            </div>

            <ul id="tasks-list" class="tasks-list"></ul>

            <div id="empty-state" class="empty-state">
                <i class="fa-regular fa-folder-open"></i>
                <p>No tienes tareas registradas. ¡Disfruta tu día!</p>
            </div>
        </main>
    </div>

</body>
</html>
